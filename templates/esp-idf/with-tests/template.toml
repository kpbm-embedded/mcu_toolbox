name        = "with-tests"
sdk         = "esp-idf"
description = "minimal plus a host-testable component with Unity tests (make -C tests/host test)"
targets     = ["esp32", "esp32s3", "esp32c3", "esp32c6", "esp32p4"]
default_target = "esp32c3"
[vars]
LED_PIN = { esp32 = "2", esp32s3 = "2", esp32c3 = "8", esp32c6 = "15", esp32p4 = "23" }
BOARD = { esp32 = "esp32-wroom32-ch340c", esp32s3 = "esp32s3-devkit", esp32c3 = "esp32c3-supermini", esp32c6 = "esp32c6", esp32p4 = "wt9932p4-tiny" }
