name        = "minimal"
sdk         = "pico"
description = "Blink the LED and print over USB CDC; the smallest real Pico SDK app"
targets     = ["pico", "zero", "pico2", "pico2-riscv", "rp2350-zero", "rp2350-zero-riscv"]
default_target = "pico"
[vars]
LED_PIN = { pico = "25", zero = "15", pico2 = "25", pico2-riscv = "25", rp2350-zero = "15", rp2350-zero-riscv = "15" }
