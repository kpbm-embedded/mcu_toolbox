name        = "led-strip"
sdk         = "esp-idf"
description = "Drive the onboard WS2812 colour cycle through the built-in RMT driver"
targets     = ["esp32", "esp32s3", "esp32c3", "esp32c6", "esp32p4"]
hardware    = "ESP32-S3-Zero: WS2812 on GPIO21; ESP32-C3-Zero: WS2812 on GPIO10 (Waveshare wiki); C6 GPIO8 = C6-DevKitC-1 value, WT9932P4-TINY unverified (P4: external WS2812 on GPIO23); ESP32 WROOM-32: external WS2812 on GPIO4"
features    = ["rmt", "ws2812"]
status      = "builds; untested on hardware"
