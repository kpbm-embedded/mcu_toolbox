name        = "multicore"
sdk         = "esp-idf"
description = "Dual-core: tasks pinned to core 0 and core 1 (xTaskCreatePinnedToCore), cross-core queue, esp_ipc_call_blocking"
targets     = ["esp32", "esp32s3", "esp32p4"]
hardware    = "none (log only); dual-core chips only (ESP32, ESP32-S3, ESP32-P4)"
features    = ["freertos", "smp", "ipc", "queue"]
status      = "builds; untested on hardware"
